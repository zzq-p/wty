<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="0;url=./logicsim-refactored/">
  <title>LogicSim · 逻辑关系图</title>
  <style>
    :root{font-family:"Inter",system-ui,-apple-system,"Segoe UI","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;color:#16232e}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;text-align:center;
         background:radial-gradient(760px 420px at 50% -8%,#e2f1ee,transparent 70%),#eef2f6}
    .card{max-width:420px;padding:38px 42px;background:#fff;border:1px solid #e3eaef;border-radius:18px;
          box-shadow:0 10px 30px rgba(16,33,46,.08)}
    .mark{width:44px;height:44px;margin:0 auto 18px;border-radius:14px;
          background:linear-gradient(135deg,#6fe6cf,#17907e);
          box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 6px 16px rgba(13,103,92,.28)}
    h1{margin:0 0 8px;font-size:20px;letter-spacing:-.2px}
    p{margin:0 0 22px;font-size:13px;color:#75899a}
    a{display:inline-block;padding:10px 20px;font-size:14px;font-weight:600;color:#fff;text-decoration:none;
      border-radius:10px;background:linear-gradient(135deg,#14907e,#0b5f54);
      box-shadow:0 4px 14px rgba(13,103,92,.3);transition:transform .16s ease,box-shadow .16s ease}
    a:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(13,103,92,.36)}
    a:focus-visible{outline:3px solid rgba(20,144,126,.55);outline-offset:2px}
    @media (prefers-reduced-motion:reduce){a{transition:none}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark"></div>
    <h1>LogicSim 逻辑关系图</h1>
    <p>正在打开 · 所有计算均在本地完成</p>
    <a href="./logicsim-refactored/">立即进入</a>
  </main>
</body>
</html>
